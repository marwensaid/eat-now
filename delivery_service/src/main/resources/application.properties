# Application
spring.application.name=delivery-service
server.port=8083

# Order Service URL
order.service.url=http://localhost:8082

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Resilience4j - Circuit Breaker pour deliveryService
resilience4j.circuitbreaker.instances.deliveryService.sliding-window-size=10
resilience4j.circuitbreaker.instances.deliveryService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.deliveryService.wait-duration-in-open-state=10000
resilience4j.circuitbreaker.instances.deliveryService.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.deliveryService.minimum-number-of-calls=5

# Resilience4j - Circuit Breaker pour orderService
resilience4j.circuitbreaker.instances.orderService.sliding-window-size=10
resilience4j.circuitbreaker.instances.orderService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.orderService.wait-duration-in-open-state=10000
resilience4j.circuitbreaker.instances.orderService.permitted-number-of-calls-in-half-open-state=5

# Resilience4j - Retry pour deliveryService
resilience4j.retry.instances.deliveryService.max-attempts=3
resilience4j.retry.instances.deliveryService.wait-duration=500ms
resilience4j.retry.instances.deliveryService.exponential-backoff-multiplier=2

# Resilience4j - Retry pour orderService
resilience4j.retry.instances.orderService.max-attempts=3
resilience4j.retry.instances.orderService.wait-duration=500ms
resilience4j.retry.instances.orderService.exponential-backoff-multiplier=2

# Resilience4j - Time Limiter pour deliveryService
resilience4j.timelimiter.instances.deliveryService.timeout-duration=5s

# Resilience4j - Time Limiter pour orderService
resilience4j.timelimiter.instances.orderService.timeout-duration=5s

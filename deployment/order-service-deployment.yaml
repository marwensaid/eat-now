apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app.kubernetes.io/part-of: eatnow-app
spec:
  selector:
    app: order-service
  ports:
    - name: http
      protocol: TCP
      port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: eatnow/order-service:v10
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: MENU_SERVICE_URL
              value: "http://menu-service:8081"
            - name: DELIVERY_SERVICE_URL
              value: "http://delivery-service:8083"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

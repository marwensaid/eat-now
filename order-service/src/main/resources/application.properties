# Configuration du port du serveur
server.port=8082

# Nom de l'application
spring.application.name=order-service

# Configuration de l'Actuator pour Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# Activation des groupes de sondes pour Kubernetes
management.health.probes.enabled=true

# URL du service de menu (pour la communication inter-services)
menu-service.url=http://localhost:8081

# Configuration de Resilience4j
resilience4j.retry:
    instances:
        menu-service:
            max-attempts: 3
            wait-duration: 100ms

resilience4j.circuitbreaker:
    instances:
        menu-service:
            register-health-indicator: true
            sliding-window-size: 10
            failure-rate-threshold: 50
            wait-duration-in-open-state: 10s
            permitted-number-of-calls-in-half-open-state: 3

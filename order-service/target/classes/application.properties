# URLs for inter-service communication (local development)
# These are overridden by environment variables in Kubernetes.
menu-service.url=http://localhost:8081
delivery-service.url=http://localhost:8083

# --- Kubernetes & Application Configuration ---

# Set server port to match Kubernetes service
server.port=8082

# Enable Kubernetes health probe endpoints (/actuator/health/liveness, /readiness)
management.health.probes.enabled=true

# Expose all actuator endpoints over the web, including /prometheus
management.endpoints.web.exposure.include=*
management.metrics.web.server.request.autotime.enabled=true
# Application
spring.application.name=order_service
server.port=8082

# Menu Service Configuration
menu.service.url=http://localhost:8081

# Actuator endpoints
management.endpoints.web.exposure.include=health,prometheus,metrics,info
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.orderService.sliding-window-size=10
resilience4j.circuitbreaker.instances.orderService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.orderService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.orderService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.orderService.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.menuService.sliding-window-size=10
resilience4j.circuitbreaker.instances.menuService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.menuService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.menuService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.menuService.permitted-number-of-calls-in-half-open-state=3

# Resilience4j Retry
resilience4j.retry.instances.orderService.max-attempts=3
resilience4j.retry.instances.orderService.wait-duration=500ms

resilience4j.retry.instances.menuService.max-attempts=3
resilience4j.retry.instances.menuService.wait-duration=500ms

# Resilience4j TimeLimiter
resilience4j.timelimiter.instances.orderService.timeout-duration=2s
resilience4j.timelimiter.instances.menuService.timeout-duration=2s

# Logging
logging.level.anthony1.com.order_service=INFO
logging.level.io.github.resilience4j=DEBUG

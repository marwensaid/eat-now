---
# Ingress pour exposer tous les services via un point d'entrée unique
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eat-now-ingress
  namespace: eat-now
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: eat-now.local
    http:
      paths:
      # Menu Service
      - path: /menu(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: menu-service
            port:
              number: 8081
      # Order Service
      - path: /order(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: order-service
            port:
              number: 8082
      # Delivery Service
      - path: /delivery(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: delivery-service
            port:
              number: 8083
  # Route par défaut vers menu-service
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: menu-service
            port:
              number: 8081
